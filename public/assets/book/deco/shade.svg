<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 100" preserveAspectRatio="none">
  <!-- lớp tối dần (trên đậm → dưới trong suốt), đặt đè lên ảnh để chữ sáng màu đọc rõ; xoay 180° để tối ở dưới -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c130b" stop-opacity="0.82"/>
      <stop offset="0.45" stop-color="#1c130b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1c130b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="10" height="100" fill="url(#g)"/>
</svg>
